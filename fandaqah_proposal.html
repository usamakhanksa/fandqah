<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fandaqah — Client Proposal</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Public+Sans:wght@300;400;500;600;700&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4/fonts/remixicon.css">
<style>
  :root{
    --navy:#0c1f3a; --navy2:#16305c; --accent:#e63946; --accent-soft:rgba(230,57,70,.12);
    --gold:#c9923c; --gold-soft:rgba(201,146,60,.14); --paper:#f7f3ec; --page:#fffdf9;
    --ink:#1a2332; --muted:#6b7688; --border:rgba(12,31,58,.10); --spine:#8a1f29;
  }
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(1200px 700px at 50% -10%, #1a3055 0%, #0c1f3a 55%, #071428 100%);font-family:'Public Sans',sans-serif;color:var(--ink);min-height:100vh;padding:28px 16px 60px;overflow-x:hidden}
  .stage{overflow-x:auto;padding-bottom:8px}
  .font-display{font-family:'Sora',sans-serif}
  .font-ar{font-family:'Cairo',sans-serif}
  .tabnum{font-variant-numeric:tabular-nums}

  /* ===== BOOK STAGE ===== */
  .stage{max-width:1040px;margin:0 auto;position:relative}
  .book-wrap{position:relative;width:100%;min-width:720px;aspect-ratio:16/10;perspective:2600px;margin:0 auto}
  .book{position:absolute;inset:0;transform-style:preserve-3d}
  .page{position:absolute;top:0;height:100%;width:50%;transform-style:preserve-3d;backface-visibility:hidden}
  .page.left{left:0;border-radius:10px 0 0 10px;box-shadow:inset -14px 0 24px -14px rgba(12,31,58,.22)}
  .page.right{right:0;border-radius:0 10px 10px 0;box-shadow:inset 14px 0 24px -14px rgba(12,31,58,.22)}
  .face{position:absolute;inset:0;background:var(--page);overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden}
  .face.back{transform:rotateY(180deg)}
  .page-inner{height:100%;overflow-y:auto;padding:26px 28px 30px;position:relative}
  .page-inner::-webkit-scrollbar{width:5px}
  .page-inner::-webkit-scrollbar-thumb{background:rgba(12,31,58,.18);border-radius:4px}
  .page.right .page-inner{padding-left:34px}
  .page.left .page-inner{padding-right:34px}

  /* flipping page */
  .flipper{position:absolute;top:0;right:0;height:100%;width:50%;transform-origin:left center;transform-style:preserve-3d;z-index:50;pointer-events:none;visibility:hidden}
  .flipper .face{backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
  .flipper .face.front{border-radius:0 10px 10px 0;box-shadow:inset 14px 0 24px -14px rgba(12,31,58,.22)}
  .flipper .face.back{transform:rotateY(180deg);border-radius:10px 0 0 10px;box-shadow:inset -14px 0 24px -14px rgba(12,31,58,.22)}
  .flip-shadow{position:absolute;top:0;left:0;height:100%;width:100%;background:linear-gradient(to left, rgba(12,31,58,.35), transparent 60%);opacity:0;pointer-events:none}
  .flip-shadow.back{background:linear-gradient(to right, rgba(12,31,58,.35), transparent 60%)}

  /* cover */
  .cover-bg{background:linear-gradient(145deg,#0c1f3a 0%,#16305c 55%,#1e3f75 100%);color:#fff;height:100%;position:relative;overflow:hidden}
  .cover-bg::before{content:"";position:absolute;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,rgba(230,57,70,.35),transparent 65%);top:-160px;right:-140px}
  .cover-bg::after{content:"";position:absolute;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,rgba(201,146,60,.22),transparent 65%);bottom:-140px;left:-120px}
  .gold-line{height:3px;background:linear-gradient(90deg,var(--gold),transparent);border-radius:2px}
  .corner-mark{position:absolute;width:60px;height:60px;border:2px solid rgba(201,146,60,.5)}

  /* module page header */
  .mod-eyebrow{font-family:'Sora';font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);font-weight:700}
  .mod-title{font-family:'Sora';font-weight:800;color:var(--navy);font-size:22px;line-height:1.1;letter-spacing:-.01em}
  .mod-ar{font-family:'Cairo';color:var(--accent);font-weight:700;font-size:15px;margin-top:2px}
  .mod-tag{font-size:11.5px;color:var(--muted);line-height:1.5;margin-top:6px}
  .benefit-pill{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:20px;background:var(--accent-soft);color:var(--navy);font-size:10px;font-weight:600;border:1px solid rgba(230,57,70,.25)}
  .benefit-pill i{color:var(--accent);font-size:12px}
  .feat{display:flex;gap:9px;align-items:flex-start;padding:9px 10px;border-radius:9px;border:1px solid var(--border);background:#fff;transition:all .2s}
  .feat:hover{border-color:var(--accent);transform:translateY(-1px);box-shadow:0 6px 16px rgba(12,31,58,.08)}
  .feat-ico{width:28px;height:28px;border-radius:7px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:14px}
  .feat-t{font-size:11px;font-weight:700;color:var(--navy);line-height:1.25}
  .feat-d{font-size:9.5px;color:var(--muted);line-height:1.35;margin-top:1px}
  .hl-box{background:linear-gradient(135deg,#0c1f3a,#1a3560);color:#fff;border-radius:10px;padding:12px 14px;position:relative;overflow:hidden}
  .hl-box::after{content:"";position:absolute;top:-30px;right:-30px;width:90px;height:90px;border-radius:50%;background:radial-gradient(circle,rgba(230,57,70,.4),transparent 70%)}
  .hl-t{font-family:'Sora';font-weight:700;font-size:12px;color:#ffd9de;margin-bottom:6px;display:flex;align-items:center;gap:6px}
  .hl-item{font-size:10px;color:rgba(255,255,255,.85);line-height:1.5;padding-left:12px;position:relative;margin-bottom:3px}
  .hl-item::before{content:"";position:absolute;left:0;top:6px;width:5px;height:5px;border-radius:50%;background:var(--gold)}
  .conn-strip{display:flex;flex-wrap:wrap;gap:5px;margin-top:auto;padding-top:10px;border-top:1px dashed var(--border)}
  .conn-chip{font-size:9px;padding:3px 7px;border-radius:12px;background:var(--gold-soft);color:#7a5a1e;font-weight:600;display:inline-flex;align-items:center;gap:3px}
  .conn-chip i{font-size:10px}
  .page-num{position:absolute;bottom:10px;font-size:9px;color:var(--muted);font-family:'Sora';letter-spacing:.1em}
  .page-num.r{right:22px}.page-num.l{left:22px}
  .running-head{position:absolute;top:12px;font-size:8.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-family:'Sora';font-weight:600}
  .running-head.r{right:24px}.running-head.l{left:24px}

  /* controls */
  .nav-btn{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .25s;backdrop-filter:blur(6px)}
  .nav-btn:hover{background:var(--accent);border-color:var(--accent);transform:scale(1.08)}
  .nav-btn:disabled{opacity:.25;cursor:not-allowed;transform:none}
  .toc-dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.25);cursor:pointer;transition:all .25s}
  .toc-dot.active{background:var(--gold);transform:scale(1.4);box-shadow:0 0 10px rgba(201,146,60,.6)}
  .toc-item{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:10px;cursor:pointer;transition:all .2s;border:1px solid transparent}
  .toc-item:hover{background:var(--accent-soft);border-color:rgba(230,57,70,.2);transform:translateX(4px)}
  .toc-num{font-family:'Sora';font-weight:800;font-size:20px;color:var(--gold);width:28px;flex-shrink:0}
  .toc-name{font-family:'Sora';font-weight:700;font-size:13px;color:var(--navy)}
  .toc-ar{font-family:'Cairo';font-size:11px;color:var(--muted)}
  .stat-card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:12px;text-align:center;border-top:3px solid var(--accent)}
  .stat-v{font-family:'Sora';font-weight:800;font-size:24px;color:var(--navy);line-height:1}
  .stat-l{font-size:9.5px;color:var(--muted);margin-top:5px;font-weight:600;letter-spacing:.04em}
  .back-cover{background:linear-gradient(160deg,#0c1f3a,#16305c);color:#fff;height:100%;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:30px}
  .back-cover::before{content:"";position:absolute;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,rgba(201,146,60,.25),transparent 65%);top:-100px;left:-100px}
  .ribbon{display:inline-block;padding:5px 14px;background:var(--accent);color:#fff;font-family:'Sora';font-weight:700;font-size:10px;letter-spacing:.15em;text-transform:uppercase;border-radius:20px}
  .step-card{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:10px;background:#fff;border:1px solid var(--border);border-left:3px solid var(--gold)}
  .step-n{width:30px;height:30px;border-radius:50%;background:var(--navy);color:var(--gold);font-family:'Sora';font-weight:800;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
  .hint{position:absolute;bottom:-34px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.5);font-size:11px;letter-spacing:.08em;white-space:nowrap;display:flex;align-items:center;gap:8px}
  .hint i{animation:nudge 1.8s ease-in-out infinite}
  @keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(6px)}}
  .progress-track{height:3px;background:rgba(255,255,255,.12);border-radius:3px;overflow:hidden;flex:1}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--gold));border-radius:3px;transition:width .5s ease}
  @media (max-width:760px){.page-inner{padding:18px 16px !important}.mod-title{font-size:18px}.feat{padding:7px 8px}.feat-d{display:none}}
</style>
</head>
<body>

<div class="stage">
  <!-- top bar -->
  <div class="flex items-center justify-between mb-5 flex-wrap gap-3">
    <div class="flex items-center gap-3">
      <div style="width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--accent),#ff6b6b);display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Sora';font-weight:800;font-size:18px;box-shadow:0 6px 18px rgba(230,57,70,.4)">ف</div>
      <div>
        <div style="font-family:'Sora';font-weight:800;color:#fff;font-size:17px;letter-spacing:-.01em">Fandaqah <span style="color:var(--gold)">·</span> <span style="font-family:'Cairo';font-weight:700">فندقة</span></div>
        <div style="font-size:10px;color:rgba(255,255,255,.55);letter-spacing:.18em;text-transform:uppercase">Client Proposal · Built for Hotels in Saudi Arabia</div>
      </div>
    </div>
    <div class="flex items-center gap-3">
      <div class="progress-track" style="width:160px"><div id="progFill" class="progress-fill" style="width:0%"></div></div>
      <div id="spreadLabel" style="color:rgba(255,255,255,.7);font-size:11px;font-family:'Sora';font-weight:600;min-width:60px;text-align:right">01 / 07</div>
    </div>
  </div>

  <!-- book -->
  <div class="book-wrap" id="bookWrap">
    <div class="book" id="book">
      <!-- static left & right pages of current spread (updated by JS) -->
      <div class="page left" id="pageLeft"><div class="face"><div class="page-inner" id="leftContent"></div></div></div>
      <div class="page right" id="pageRight"><div class="face"><div class="page-inner" id="rightContent"></div></div></div>
      <!-- flipper -->
      <div class="flipper" id="flipper" style="transform:rotateY(0deg)">
        <div class="face front" id="flipFront"><div class="page-inner" id="flipFrontContent"></div><div class="flip-shadow" id="shadowFront"></div></div>
        <div class="face back" id="flipBack"><div class="page-inner" id="flipBackContent"></div><div class="flip-shadow back" id="shadowBack"></div></div>
      </div>
    </div>
    <!-- click zones (outside 3D context) -->
    <div id="clickNext" style="position:absolute;top:0;right:0;width:50%;height:100%;cursor:pointer;z-index:100" title="Next page"></div>
    <div id="clickPrev" style="position:absolute;top:0;left:0;width:50%;height:100%;cursor:pointer;z-index:100" title="Previous page"></div>
    <div class="hint"><i class="ri-arrow-left-right-line"></i> Click either side of the book to turn pages · or use arrows</div>
  </div>

  <!-- bottom controls -->
  <div class="flex items-center justify-center gap-5 mt-12">
    <button class="nav-btn" id="btnPrev" disabled><i class="ri-arrow-left-s-line" style="font-size:22px"></i></button>
    <div class="flex items-center gap-2" id="dots"></div>
    <button class="nav-btn" id="btnNext"><i class="ri-arrow-right-s-line" style="font-size:22px"></i></button>
  </div>
</div>

/* ================ RENDER HELPERS ================ */
function featGrid(feats){
  return feats.map(function(f){
    return '<div class="feat"><div class="feat-ico"><i class="'+f[0]+'"></i></div><div><div class="feat-t">'+f[1]+'</div><div class="feat-d">'+f[2]+'</div></div></div>';
  }).join('');
}
function benefitPills(b){
  return b.map(function(p){return '<span class="benefit-pill"><i class="'+p[0]+'"></i>'+p[1]+'</span>';}).join('');
}
function connStrip(c){
  return '<div class="conn-strip">'+c.map(function(x){return '<span class="conn-chip"><i class="ri-link"></i>'+x+'</span>';}).join('')+'</div>';
}
function hlBox(hl){
  return '<div class="hl-box"><div class="hl-t"><i class="ri-lightbulb-flash-line"></i>'+hl.t+'</div>'+
    hl.items.map(function(i){return '<div class="hl-item">'+i+'</div>';}).join('')+'</div>';
}
function modulePage(m, side){
  var rn = side==='r' ? '<div class="running-head r">Fandaqah · Module '+m.num+'</div>' : '<div class="running-head l">Client Proposal · 2026</div>';
  var pn = side==='r' ? '<div class="page-num r">— '+m.num+' —</div>' : '<div class="page-num l">— '+m.num+' —</div>';

/* ================ BOOK ENGINE ================ */
var current = 0;
var animating = false;
var total = spreads.length;
var leftContent = document.getElementById('leftContent');
var rightContent = document.getElementById('rightContent');
var flipFrontContent = document.getElementById('flipFrontContent');
var flipBackContent = document.getElementById('flipBackContent');
var flipper = document.getElementById('flipper');
var shadowFront = document.getElementById('shadowFront');
var shadowBack = document.getElementById('shadowBack');

function renderSpread(idx){
  leftContent.innerHTML = spreads[idx][0];
  rightContent.innerHTML = spreads[idx][1] || '';
  bindToc();
  updateChrome();
}
function updateChrome(){
  document.getElementById('btnPrev').disabled = current===0;
  document.getElementById('btnNext').disabled = current===total-1;
  document.getElementById('progFill').style.width = ((current+1)/total*100)+'%';
  var lbl = String(current+1).padStart(2,'0')+' / '+String(total).padStart(2,'0');
  document.getElementById('spreadLabel').textContent = lbl;
  var dots = document.querySelectorAll('.toc-dot');
  dots.forEach(function(d,i){d.classList.toggle('active', i===current);});
}
function bindToc(){
  document.querySelectorAll('.toc-item').forEach(function(el){
    el.addEventListener('click', function(){
      var target = parseInt(el.getAttribute('data-goto'),10);
      goTo(target);
    });
  });
}
function goTo(target){
  if(animating || target===current || target<0 || target>=total) return;
  if(target>current) next(target-current); else prev(current-target);
}
function next(steps){
  if(animating || current>=total-1) return;
  steps = steps||1; if(steps>1){ current++; renderSpread(current); requestAnimationFrame(function(){next(steps-1);}); return; }
  if(typeof gsap==='undefined'){ current++; renderSpread(current); return; }
  animating = true;
  flipper.style.visibility = 'visible';
  flipFrontContent.innerHTML = spreads[current][1] || '';
  flipBackContent.innerHTML = spreads[current+1][0] || '';
  flipper.style.zIndex = 50;
  gsap.set(flipper,{rotationY:0});
  gsap.set([shadowFront,shadowBack],{opacity:0});
  var tl = gsap.timeline({onComplete:function(){
    current++; renderSpread(current);
    gsap.set(flipper,{rotationY:0,zIndex:1});
    gsap.set([shadowFront,shadowBack],{opacity:0});
    flipper.style.visibility = 'hidden';
    animating=false;
  }});
  tl.to(shadowFront,{opacity:.85,duration:.4,ease:'sine.out'},0);
  tl.to(shadowFront,{opacity:0,duration:.5,ease:'sine.in'},.4);
  tl.to(shadowBack,{opacity:.7,duration:.5,ease:'sine.out'},.45);
  tl.to(shadowBack,{opacity:0,duration:.4,ease:'sine.in'},.9);
  tl.to(flipper,{rotationY:-180,duration:.95,ease:'power2.inOut'},0);
}
function prev(steps){
  if(animating || current<=0) return;
  steps = steps||1; if(steps>1){ current--; renderSpread(current); requestAnimationFrame(function(){prev(steps-1);}); return; }
  if(typeof gsap==='undefined'){ current--; renderSpread(current); return; }
  animating = true;
  flipper.style.visibility = 'visible';
  // flipper stays on the right, origin at spine (left edge); start already-turned at -180
  flipFrontContent.innerHTML = spreads[current-1][1] || ''; // visible at end (rotationY 0)
  flipBackContent.innerHTML = spreads[current][0] || '';    // visible at start (rotationY -180)
  flipper.style.zIndex = 50;
  gsap.set(flipper,{rotationY:-180});
  gsap.set([shadowFront,shadowBack],{opacity:0});
  var tl = gsap.timeline({onComplete:function(){
    current--; renderSpread(current);
    gsap.set(flipper,{rotationY:0,zIndex:1});
    gsap.set([shadowFront,shadowBack],{opacity:0});
    flipper.style.visibility = 'hidden';
    animating=false;
  }});
  tl.to(shadowBack,{opacity:.7,duration:.45,ease:'sine.out'},0);
  tl.to(shadowBack,{opacity:0,duration:.45,ease:'sine.in'},.45);
  tl.to(shadowFront,{opacity:.85,duration:.5,ease:'sine.out'},.45);
  tl.to(shadowFront,{opacity:0,duration:.4,ease:'sine.in'},.9);
  tl.to(flipper,{rotationY:0,duration:.95,ease:'power2.inOut'},0);
}

/* dots */
var dotsEl = document.getElementById('dots');
for(var d=0; d<total; d++){
  var dot = document.createElement('div');
  dot.className='toc-dot'+(d===0?' active':'');
  dot.setAttribute('data-idx',d);
  dot.addEventListener('click',function(){goTo(parseInt(this.getAttribute('data-idx'),10));});
  dotsEl.appendChild(dot);
}

document.getElementById('btnNext').addEventListener('click',function(){next();});
document.getElementById('btnPrev').addEventListener('click',function(){prev();});
document.getElementById('clickNext').addEventListener('click',function(){next();});
document.getElementById('clickPrev').addEventListener('click',function(){prev();});
document.addEventListener('keydown',function(e){
  if(e.key==='ArrowRight') next();
  if(e.key==='ArrowLeft') prev();
});

/* intro animation */
renderSpread(0);
if(typeof gsap!=='undefined'){

}
