<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2A273C">
<title>Fandaqah Owner App — Now Live | Your Hotel in Your Pocket</title>
<meta name="description" content="The Fandaqah Owner App is now live on iPhone and Android. Follow occupancy, reservations, revenue and purchase approvals across your hotels from your phone.">
<meta name="robots" content="index,follow">
<meta property="og:type" content="website">
<meta property="og:title" content="Fandaqah Owner App — Now Live">
<meta property="og:description" content="Occupancy, reservations, revenue and approvals across every property — on your phone.">
<meta property="og:image" content="assets/images/editorial/refresh/owner-app.webp">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700;9..40,800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="assets/images/editorial/refresh/city-riyadh.webp">
<style>
:root{--coral:#E9625C;--coral-2:#F08A72;--navy:#2A273C;--navy-2:#1F1C2E;--ink:#2A273C;--muted:#6B6878;--sage:#7E948A;--sage-d:#4F6559;--peach:#F6C7A6;--cream:#FBF6F2;--blush:#F7E4DC;--line:rgba(42,39,60,.09);--r:20px;--ease:cubic-bezier(.22,1,.36,1)}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--cream);color:var(--ink);font:400 16px/1.6 'DM Sans',system-ui,-apple-system,Segoe UI,Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
html[lang=ar] body{font-family:Tajawal,'Noto Sans Arabic',Tahoma,sans-serif}
h1,h2,h3,p{margin:0}a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer}img,svg{display:block;max-width:100%}
ul{list-style:none;margin:0;padding:0}
:focus-visible{outline:3px solid var(--coral);outline-offset:3px;border-radius:6px}
.ico{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrap{width:min(1240px,100% - 48px);margin-inline:auto;position:relative}
.eyebrow{display:flex;align-items:center;gap:14px;font-weight:800;font-size:clamp(20px,2vw,26px);color:var(--navy);letter-spacing:-.01em}
.eyebrow:before{content:"";width:44px;height:3px;border-radius:3px;background:var(--coral);flex:none}
.h2{font-size:clamp(28px,3.3vw,44px);line-height:1.12;font-weight:800;letter-spacing:-.03em}
html[lang=ar] .h2,html[lang=ar] .eyebrow{letter-spacing:0;line-height:1.35}
.lead{color:var(--muted);font-size:clamp(15px,1.3vw,17px);line-height:1.75}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .8s var(--ease),transform .8s var(--ease);transition-delay:calc(var(--d,0) * 70ms)}
.reveal.in{opacity:1;transform:none}

/* header (ads page: no outbound navigation) */
.top{position:absolute;inset:0 0 auto;z-index:20;padding:22px 0}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px}
.logo img{height:56px;width:auto}
.top-r{display:flex;align-items:center;gap:10px}
.lang{display:inline-flex;padding:4px;border-radius:40px;background:rgba(255,255,255,.75);backdrop-filter:blur(10px);border:1px solid var(--line);direction:ltr}
.lang button{border:0;background:none;padding:7px 13px;border-radius:30px;font-weight:800;font-size:13px;color:var(--navy)}
.lang button[aria-pressed=true]{background:var(--navy);color:#fff}
.btn-sm{display:inline-flex;align-items:center;gap:8px;padding:11px 18px;border-radius:40px;background:var(--coral);color:#fff;font-weight:800;font-size:14px;box-shadow:0 10px 22px -12px var(--coral)}
.btn-sm .ico{width:18px;height:18px}

/* store badges */
.stores{display:flex;flex-wrap:wrap;gap:12px}
.store{display:inline-flex;align-items:center;gap:11px;height:60px;padding:0 20px 0 16px;border-radius:14px;background:#0F0E15;color:#fff;direction:ltr;text-align:left;box-shadow:0 14px 26px -16px rgba(15,14,21,.8);transition:transform .25s var(--ease),box-shadow .25s}
.store:hover{transform:translateY(-3px);box-shadow:0 20px 34px -16px rgba(15,14,21,.85)}
.store svg{width:28px;height:30px}
.store span{display:flex;flex-direction:column;line-height:1.05;font-weight:700;font-size:21px;letter-spacing:-.01em;white-space:nowrap}
.store small{font-size:10.5px;font-weight:500;letter-spacing:.02em;opacity:.85;margin-bottom:2px}
.store--light{background:#fff;color:var(--navy)}
.qr{flex:none;width:128px;padding:10px;border-radius:18px;background:#fff;box-shadow:0 16px 32px -20px rgba(42,39,60,.55);text-align:center}
.qr-box{aspect-ratio:1;display:grid;place-items:center}
.qr-box svg{width:100%;height:100%}
.qr small{display:block;margin-top:4px;font-size:11px;font-weight:700;color:var(--muted);line-height:1.3}

/* HERO */
.hero{position:relative;isolation:isolate;overflow:hidden;padding:120px 0 40px;min-height:720px;background:linear-gradient(115deg,#FDF9F6 0%,#FAEDE6 50%,#F6DDD2 100%)}
.hero-sky{position:absolute;z-index:-2;inset:0 0 auto auto;width:62%;height:100%;background:url(assets/images/editorial/refresh/city-riyadh.webp) 70% 30%/cover no-repeat;
 -webkit-mask:linear-gradient(90deg,transparent,#000 38%) ;mask:linear-gradient(90deg,transparent,#000 38%);opacity:.9}
.hero-sky:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(253,249,246,0) 40%,rgba(250,237,230,.95) 92%)}
html[dir=rtl] .hero-sky{inset:0 auto auto 0;transform:scaleX(-1)}
.hero-wave{position:absolute;z-index:-1;right:-12%;bottom:-22%;width:78%;height:62%;border-radius:50%;background:linear-gradient(105deg,rgba(233,98,92,0) 10%,rgba(233,98,92,.92) 55%,var(--coral));transform:rotate(-8deg)}
html[dir=rtl] .hero-wave{right:auto;left:-12%;transform:rotate(8deg) scaleX(-1)}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.02fr) minmax(0,1fr);gap:24px;align-items:center}
.live{display:inline-flex;align-items:center;gap:10px;padding:7px 14px 7px 10px;border-radius:40px;background:#fff;border:1px solid var(--line);font-weight:800;font-size:13px;color:var(--sage-d);box-shadow:0 8px 20px -14px rgba(42,39,60,.4)}
.live i{width:9px;height:9px;border-radius:50%;background:#22A06B;box-shadow:0 0 0 0 rgba(34,160,107,.6);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 10px rgba(34,160,107,0)}100%{box-shadow:0 0 0 0 rgba(34,160,107,0)}}
.hero-kicker{margin-top:22px;font-size:clamp(20px,2.1vw,28px);font-weight:700;color:var(--sage-d);display:flex;align-items:center;gap:14px}
.hero-kicker:after{content:"";width:56px;height:3px;border-radius:3px;background:var(--coral)}
.hero h1{margin-top:6px;font-size:clamp(64px,9vw,128px);line-height:.95;font-weight:800;letter-spacing:-.055em;color:var(--coral);
 background:linear-gradient(100deg,#E9625C 0%,#F08A72 45%,#E9625C 70%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;background-size:200% 100%;animation:sheen 6s ease-in-out infinite}
@keyframes sheen{50%{background-position:100% 0}}
html[lang=ar] .hero h1{letter-spacing:0;line-height:1.2;font-size:clamp(56px,8vw,112px)}
.hero-lead{margin-top:20px;max-width:34em;font-size:clamp(16px,1.45vw,19px);line-height:1.7;color:#4B4858}
.hero-sub{margin-top:8px;max-width:36em;font-size:14px;color:var(--muted)}
.hero-cta{display:flex;align-items:center;gap:18px;margin-top:30px}
.hero-cta .stores{flex-direction:column;align-items:stretch}
.hero-note{margin-top:14px;font-size:12.5px;color:var(--muted)}
.hero-note b{color:var(--navy)}

/* phones */
.stage{position:relative;height:600px;direction:ltr}
.plinth{position:absolute;left:50%;bottom:18px;width:470px;height:86px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(ellipse at 45% 35%,#FBF7F4,#E7DCD4 62%,#CDBCB0);box-shadow:0 30px 50px -22px rgba(42,39,60,.5),inset 0 -10px 16px rgba(0,0,0,.07)}
.plinth:before{content:"";position:absolute;inset:-16px 0 auto;height:86px;border-radius:50%;background:radial-gradient(ellipse at 40% 40%,#fff,#ECE3DC 72%)}
.phone{position:absolute;width:262px;height:540px;padding:8px;border-radius:46px;background:linear-gradient(145deg,#F3D7C7,#C29079 42%,#EBC8B3 68%,#A87661);box-shadow:0 46px 70px -30px rgba(31,28,46,.7),inset 0 0 0 1px rgba(255,255,255,.4)}
.phone--front{right:44px;bottom:62px;z-index:2;animation:floatA 7s ease-in-out infinite}
.phone--back{left:30px;bottom:92px;transform:rotate(-7deg) scale(.86);transform-origin:bottom;animation:floatB 8s ease-in-out infinite}
@keyframes floatA{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(-3deg) translateY(-12px)}}
@keyframes floatB{0%,100%{transform:rotate(-7deg) scale(.86)}50%{transform:rotate(-7deg) scale(.86) translateY(-9px)}}
.scr{height:100%;border-radius:38px;overflow:hidden;background:linear-gradient(180deg,#2E2B42,#211E31);color:#fff;padding:12px 13px;display:flex;flex-direction:column;gap:9px;font-size:11px;line-height:1.25;text-align:start}
html[dir=rtl] .scr{direction:rtl}
.st{display:flex;align-items:center;justify-content:space-between;padding:1px 10px 0;font-size:10px;font-weight:700;direction:ltr}
.st i{width:76px;height:21px;border-radius:20px;background:#000}
.st b{width:22px;height:10px;border-radius:3px;border:1.5px solid rgba(255,255,255,.85)}
.tb{display:flex;align-items:center;justify-content:space-between;min-height:30px}
.tb img{height:26px;width:auto;margin-inline:auto}
.tb .ico{width:17px;height:17px}
.dot{position:relative}.dot:after{content:"";position:absolute;top:-1px;inset-inline-end:-1px;width:6px;height:6px;border-radius:50%;background:var(--coral)}
.hi b{display:block;font-size:15px}.hi small{opacity:.7;font-size:10.5px}
.kp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.k{border-radius:15px;padding:10px;display:flex;flex-direction:column;gap:2px}
.k .ico{width:18px;height:18px;margin-bottom:4px}
.k small{font-size:9px;opacity:.85}.k b{font-size:14.5px;white-space:nowrap;font-variant-numeric:tabular-nums}.k em{font-style:normal;font-size:9px;font-weight:700}
.k--sage{background:linear-gradient(160deg,#869F92,#4F6559)}.k--sage em{color:#CFF3DC}
.k--peach{background:linear-gradient(160deg,#FAD7BA,#EFAD86);color:var(--navy)}.k--peach em{color:#237A48}
.k--coral{background:linear-gradient(160deg,#F08A72,#E25A55)}
.k--light{background:#F7F2EE;color:var(--navy)}
.card{border-radius:15px;padding:10px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.06)}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:10.5px}
.card-h b{display:flex;align-items:center;gap:5px}.card-h .ico{width:13px;height:13px;color:var(--coral)}
.card-h small{font-size:8.5px;opacity:.65}
.chart{position:relative;direction:ltr;height:82px;margin-top:9px;display:flex;align-items:flex-end;gap:3px;background:repeating-linear-gradient(0deg,rgba(255,255,255,.07) 0 1px,transparent 1px 20px)}
.chart span{flex:1;height:var(--h);border-radius:3px 3px 0 0;background:linear-gradient(180deg,#93B5A2,#4F6559);transform-origin:bottom;transition:transform .9s var(--ease) calc(var(--i) * 45ms)}
.chart svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.chart polyline{fill:none;stroke:var(--coral);stroke-width:2;stroke-linejoin:round;vector-effect:non-scaling-stroke;stroke-dasharray:1;stroke-dashoffset:0;transition:stroke-dashoffset 1.8s ease .4s;filter:drop-shadow(0 2px 4px rgba(233,98,92,.55))}
.js .phone:not(.live-on) .chart span{transform:scaleY(0)}
.js .phone:not(.live-on) .chart polyline{stroke-dashoffset:1}
.acts{display:flex;justify-content:space-between;margin-top:8px}
.acts span{display:flex;align-items:center;gap:4px}.acts span+span{border-inline-start:1px solid rgba(255,255,255,.14);padding-inline-start:7px}
.acts .ico{width:14px;height:14px;color:var(--coral)}.acts b{font-size:14px}.acts small{font-size:8px;opacity:.7}
.nav{margin-top:auto;display:flex;gap:2px;padding:5px;border-radius:19px;background:rgba(255,255,255,.07)}
.nav span{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:14px;font-size:8.5px;opacity:.7}
.nav .ico{width:15px;height:15px}.nav .on{background:var(--coral);opacity:1;box-shadow:0 6px 12px -6px var(--coral)}
.h{font-size:15px;font-weight:800}
.prop{border-radius:13px;overflow:hidden;background:#F7F2EE;color:var(--navy)}
.prop i{display:block;height:78px;background:#C9B8A6 center/cover}
.prop div{display:flex;justify-content:space-between;align-items:center;padding:6px 9px}
.prop b{display:block;font-size:11px}.prop small{font-size:9px;color:var(--muted)}.prop .ico{width:12px;height:12px}
html[dir=rtl] .prop .ico{transform:scaleX(-1)}
.row{display:flex;align-items:center;gap:8px;padding:8px;border-radius:12px;background:#F7F2EE;color:var(--navy)}
.row .ri{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:#fff;color:var(--coral)}.row .ri .ico{width:15px;height:15px}
.row b{display:block;font-size:10.5px}.row small{font-size:8.5px;color:var(--muted)}
.row em{margin-inline-start:auto;font-style:normal;font-size:8.5px;font-weight:800;padding:3px 7px;border-radius:20px;background:#FCE3DC;color:#C2433E}
.row em.ok{background:#DDF1E5;color:#237A48}
.ring{display:grid;place-items:center;margin:4px auto 0;width:118px;height:118px;border-radius:50%;background:conic-gradient(var(--coral) 0 86%,rgba(255,255,255,.1) 0)}
.ring b{display:grid;place-items:center;width:92px;height:92px;border-radius:50%;background:#262338;font-size:22px}

.scr--shot{padding:0;background:#F5F3F0;display:block}
.scr--shot img{width:100%;height:100%;object-fit:cover;object-position:top center}
a.qr{display:block;color:inherit;transition:transform .25s var(--ease)}a.qr:hover{transform:translateY(-3px)}
.qr-box{position:relative}
.qr-logo{position:absolute;left:50%;top:50%;width:20%;height:20%;transform:translate(-50%,-50%);display:grid;place-items:center;background:#fff;border-radius:22%}
.qr-logo svg{width:62%;height:62%;color:#1F1C2E}
/* real-screens marquee */
.mq{padding:70px 0 40px;overflow:hidden}
.mq-track{display:flex;gap:28px;width:max-content;margin-top:30px;padding:10px 0 20px;direction:ltr;animation:mq 60s linear infinite}
.mq:hover .mq-track{animation-play-state:paused}
@keyframes mq{to{transform:translateX(-50%)}}
.mq-item{margin:0;width:190px;flex:none;display:flex;flex-direction:column;align-items:center;gap:12px}
.mq-item .phone{position:relative;inset:auto;width:190px;height:auto;aspect-ratio:262/540;padding:6px;border-radius:34px;animation:none;transform:none;box-shadow:0 26px 40px -24px rgba(31,28,46,.55)}
.mq-item .scr{border-radius:28px}
.mq-item:nth-child(even){margin-top:34px}
.mq-item figcaption{font-size:13px;font-weight:800;text-align:center}
html[dir=rtl] .mq-item figcaption{direction:rtl}

/* FEATURES */
.feat{padding:56px 0 64px}
.fgrid{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:14px;margin-top:28px}
.fcard{display:flex;flex-direction:column;align-items:center;gap:12px;padding:22px 10px 18px;border-radius:var(--r);background:#fff;border:1px solid var(--line);box-shadow:0 12px 28px -22px rgba(42,39,60,.45);text-align:center;transition:transform .3s var(--ease),box-shadow .3s}
.fcard:hover{transform:translateY(-6px);box-shadow:0 22px 38px -22px rgba(233,98,92,.55)}
.fcard .fi{width:58px;height:58px;border-radius:16px;display:grid;place-items:center;color:var(--coral);background:linear-gradient(160deg,#FFF3EE,#FBE1D8)}
.fcard .fi .ico{width:30px;height:30px}
.fcard b{font-size:14px;line-height:1.3}
.fcard small{font-size:12px;color:var(--muted);line-height:1.4}

/* GALLERY */
.gallery{position:relative;isolation:isolate;overflow:hidden;padding:70px 0}
.gallery-bg{position:absolute;inset:0;z-index:-2;background:url(assets/images/editorial/lobby-wide.webp) 30% 60%/cover}
.gallery-bg:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(251,246,242,.35) 0%,rgba(251,246,242,.55) 50%,rgba(251,246,242,.97) 70%)}
html[dir=rtl] .gallery-bg{transform:scaleX(-1)}
.gallery-wave{position:absolute;z-index:-1;right:-15%;bottom:-40%;width:55%;height:70%;border-radius:50%;background:linear-gradient(120deg,rgba(233,98,92,0),rgba(233,98,92,.85))}
html[dir=rtl] .gallery-wave{right:auto;left:-15%;transform:scaleX(-1)}
.ggrid{display:grid;grid-template-columns:minmax(0,1.9fr) minmax(0,1fr);gap:36px;align-items:center}
.minis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;direction:ltr}
.mini{display:flex;flex-direction:column;align-items:center;gap:12px}
.mini .phone{position:relative;inset:auto;width:100%;max-width:200px;height:auto;aspect-ratio:262/540;animation:none;transform:none;padding:6px;border-radius:34px}
.mini .scr{border-radius:28px;font-size:9px;padding:9px 9px;gap:7px}
.mini .k b{font-size:11px}.mini .k{padding:7px}.mini .kp{gap:5px}
.mini:nth-child(even) .phone{transform:translateY(26px)}
.mini h3{font-size:13.5px;font-weight:800;text-align:center;padding:6px 12px;border-radius:30px;background:rgba(255,255,255,.85);backdrop-filter:blur(6px)}
.mini:nth-child(even) h3{margin-top:26px}
.gcopy img{height:72px;width:auto;margin-bottom:22px}
.gcopy .h2{font-size:clamp(26px,2.6vw,36px)}
.gcopy p{margin-top:14px}
.gcopy small{display:block;margin-top:14px;font-size:12px;color:var(--muted)}

/* ECOSYSTEM */
.eco{padding:84px 0;background:linear-gradient(180deg,var(--cream),#F8EEE8)}
.egrid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:48px;align-items:center}
.elist{display:grid;grid-template-columns:1fr 1fr;gap:26px 28px;margin-top:34px}
.eitem{display:flex;gap:14px}
.eitem .ei{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;flex:none;background:#fff;color:var(--sage-d);border:1px solid var(--line);box-shadow:0 10px 20px -16px rgba(42,39,60,.5)}
.eitem b{display:block;font-size:15.5px}.eitem p{font-size:13.5px;color:var(--muted);line-height:1.55;margin-top:2px}
.orbit{direction:ltr;position:relative;aspect-ratio:1;max-width:520px;width:100%;margin-inline:auto}
.orbit:before,.orbit:after{content:"";position:absolute;border-radius:50%;border:1.5px dashed rgba(42,39,60,.16)}
.orbit:before{inset:9%;animation:spin 60s linear infinite}
.orbit:after{inset:27%;border-style:solid;border-color:rgba(233,98,92,.18)}
@keyframes spin{to{transform:rotate(360deg)}}
.core{position:absolute;inset:32%;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 30px 60px -30px rgba(42,39,60,.55),0 0 0 14px rgba(255,255,255,.55)}
.core img{width:70%}
.node{position:absolute;left:50%;top:50%;width:0;height:0;transform:rotate(var(--a)) translate(min(41vw,213px)) rotate(calc(-1 * var(--a)))}
.node span{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:7px;width:110px;text-align:center;font-size:12.5px;font-weight:800}
.node .bub{width:68px;height:68px;border-radius:50%;display:grid;place-items:center;color:#fff;background:linear-gradient(160deg,#F08A72,#E25A55);box-shadow:0 14px 26px -12px rgba(233,98,92,.8);animation:bob 4s ease-in-out infinite;animation-delay:calc(var(--n) * -.6s)}
.node:nth-child(even) .bub{background:linear-gradient(160deg,#93AA9E,#5D7467);box-shadow:0 14px 26px -12px rgba(79,101,89,.8)}
.node .bub .ico{width:30px;height:30px}
@keyframes bob{50%{transform:translateY(-6px)}}

/* START (photo) */
.start{padding:84px 0}
.sgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.9fr) minmax(0,1fr);gap:36px;align-items:center}
.steps{display:grid;gap:16px;margin-top:26px}
.step{display:flex;gap:16px;align-items:flex-start;padding:18px;border-radius:var(--r);background:#fff;border:1px solid var(--line)}
.step .n{width:46px;height:46px;flex:none;border-radius:14px;display:grid;place-items:center;font-weight:800;color:#fff;background:linear-gradient(160deg,#F08A72,#E25A55)}
.step b{display:block;font-size:15.5px}.step p{font-size:13.5px;color:var(--muted);margin-top:2px}
.photo{position:relative;border-radius:28px;overflow:hidden;aspect-ratio:4/5;box-shadow:0 40px 70px -40px rgba(42,39,60,.7)}
.photo img{width:100%;height:100%;object-fit:cover;object-position:35% 50%}
.photo figcaption{position:absolute;inset:auto 14px 14px;display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);font-size:13px;font-weight:700}
.photo figcaption i{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:#DDF1E5;color:#237A48;flex:none}
.photo figcaption i .ico{width:20px;height:20px}
.paths{display:grid;gap:16px}
.path{padding:24px;border-radius:24px;background:#fff;border:1px solid var(--line);box-shadow:0 16px 34px -26px rgba(42,39,60,.5)}
.path .pi{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;color:#fff;background:linear-gradient(160deg,#F08A72,#E25A55);margin-bottom:14px}
.path:nth-child(2) .pi{background:linear-gradient(160deg,#3A3652,var(--navy))}
.path h3{font-size:18px;font-weight:800}.path p{margin-top:6px;font-size:14px;color:var(--muted)}
.path a{margin-top:14px;display:inline-flex;align-items:center;gap:8px;font-weight:800;font-size:14px;color:var(--coral)}
.path a .ico{width:18px;height:18px;transition:transform .2s}.path a:hover .ico{transform:translateX(4px)}
html[dir=rtl] .path a .ico{transform:scaleX(-1)}html[dir=rtl] .path a:hover .ico{transform:scaleX(-1) translateX(4px)}

/* 360 + FAQ */
.faqsec{padding:20px 0 90px}
.fqgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:40px;align-items:start}
.c360{position:relative;overflow:hidden;padding:36px;border-radius:28px;background:var(--navy);color:#fff}
.c360:after{content:"360";position:absolute;inset-inline-end:-10px;bottom:-40px;font-size:170px;font-weight:800;letter-spacing:-.06em;color:rgba(255,255,255,.05);line-height:1}
.c360 .eyebrow{color:#fff;font-size:15px}
.c360 h2{margin-top:14px;font-size:clamp(26px,2.6vw,36px);line-height:1.15;font-weight:800;letter-spacing:-.03em}
.c360 p{margin-top:14px;color:rgba(255,255,255,.78);font-size:15px;line-height:1.7}
.c360 ul{display:grid;gap:10px;margin-top:22px}
.c360 li{display:flex;gap:10px;align-items:center;font-size:14px;font-weight:600}
.c360 li .ico{width:20px;height:20px;color:var(--coral-2)}
.c360 .btn{margin-top:26px;display:inline-flex;align-items:center;gap:10px;padding:14px 22px;border-radius:40px;background:var(--coral);font-weight:800;color:#fff;position:relative;z-index:1}
.faq{display:grid;gap:10px;margin-top:22px}
.faq details{border-radius:16px;background:#fff;border:1px solid var(--line);transition:box-shadow .25s}
.faq details[open]{box-shadow:0 16px 34px -26px rgba(42,39,60,.55)}
.faq summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:14px;padding:17px 20px;font-weight:800;font-size:15px}
.faq summary::-webkit-details-marker{display:none}
.faq summary i{width:28px;height:28px;flex:none;border-radius:50%;display:grid;place-items:center;background:#FCE7E0;color:var(--coral);transition:transform .3s var(--ease)}
.faq summary i .ico{width:16px;height:16px}
.faq details[open] summary i{transform:rotate(45deg)}
.faq p{padding:0 20px 18px;color:var(--muted);font-size:14px;line-height:1.7}

/* FINAL CTA */
.final{position:relative;isolation:isolate;overflow:hidden;background:var(--navy-2);color:#fff}
.final-bg{position:absolute;inset:0 auto 0 0;width:42%;z-index:-1;background:url(assets/images/editorial/lobby-wide.webp) 85% 60%/cover;-webkit-mask:linear-gradient(90deg,#000 35%,transparent);mask:linear-gradient(90deg,#000 35%,transparent);opacity:.75}
html[dir=rtl] .final-bg{inset:0 0 0 auto;transform:scaleX(-1)}
.final-wave{position:absolute;z-index:-1;right:-10%;bottom:-60%;width:50%;height:120%;border-radius:50%;background:radial-gradient(circle at 30% 30%,rgba(240,138,114,.55),rgba(233,98,92,0) 65%)}
.final .wrap{display:grid;grid-template-columns:minmax(0,.7fr) minmax(0,1.3fr) auto;gap:36px;align-items:center;padding:64px 0}
.final h2{font-size:clamp(28px,3.2vw,44px);line-height:1.12;font-weight:800;letter-spacing:-.03em}
html[lang=ar] .final h2{letter-spacing:0;line-height:1.35}
.final p{margin-top:10px;color:rgba(255,255,255,.75)}
.final .stores{margin-top:24px}
.final .qr{width:150px}
.legal{padding:22px 0 calc(22px + env(safe-area-inset-bottom));background:#17151F;color:rgba(255,255,255,.6);font-size:12.5px}
.legal .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.legal a{color:#fff;font-weight:700}

/* mobile sticky download bar */
.dock{position:fixed;z-index:40;inset:auto 12px calc(12px + env(safe-area-inset-bottom));display:none;align-items:center;gap:12px;padding:10px 10px 10px 16px;border-radius:20px;background:rgba(31,28,46,.94);backdrop-filter:blur(12px);color:#fff;box-shadow:0 20px 40px -16px rgba(0,0,0,.6);transform:translateY(140%);transition:transform .45s var(--ease)}
.dock.show{transform:none}
.dock b{font-size:14px;line-height:1.25}.dock small{display:block;font-size:11.5px;opacity:.7;font-weight:500}
.dock a{margin-inline-start:auto;flex:none;padding:12px 18px;border-radius:14px;background:var(--coral);font-weight:800;font-size:14px}

/* responsive */
@media (max-width:1180px){
 .fgrid{grid-template-columns:repeat(4,minmax(0,1fr))}
 .sgrid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
 .sgrid .paths{grid-column:1/-1;grid-template-columns:1fr 1fr}
 .final .wrap{grid-template-columns:minmax(0,1fr) auto}
 .final .final-pad{display:none}
}
@media (max-width:980px){
 .hero{padding-top:104px;min-height:0}
 .hero-grid,.ggrid,.egrid,.fqgrid{grid-template-columns:minmax(0,1fr)}
 .hero-copy{text-align:center;display:flex;flex-direction:column;align-items:center}
 .hero-kicker{justify-content:center}
 .hero-cta{justify-content:center}
 .hero-sky{width:100%;height:58%;inset:auto 0 0 0;-webkit-mask:linear-gradient(180deg,transparent,#000 40%);mask:linear-gradient(180deg,transparent,#000 40%)}
 html[dir=rtl] .hero-sky{inset:auto 0 0 0}
 .hero-wave{width:130%;height:40%;bottom:-12%}
 .stage{width:540px;margin-inline:auto;margin-top:-10px}
 .gallery-bg:after{background:rgba(251,246,242,.82)}
 .gcopy{text-align:center;order:-1}.gcopy img{margin-inline:auto}
 .orbit{max-width:460px}
 .sgrid{grid-template-columns:minmax(0,1fr)}
 .photo{aspect-ratio:16/10;max-height:440px}
 .final .wrap{grid-template-columns:minmax(0,1fr);text-align:center;justify-items:center}
 .final .stores{justify-content:center}
 .final-bg{width:100%;-webkit-mask:linear-gradient(180deg,#000,transparent 70%);mask:linear-gradient(180deg,#000,transparent 70%);opacity:.35}
}
@media (max-width:760px){
 .top .btn-sm{display:none}
 .logo img{height:46px}
 .stage{transform:scale(.72);transform-origin:top center;margin-bottom:-168px;margin-inline:calc((100% - 540px)/2)}
 .fgrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
 .minis{grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 14px}
 .mini .phone{max-width:170px}
 .elist{grid-template-columns:minmax(0,1fr)}
 .sgrid .paths{grid-template-columns:minmax(0,1fr)}
 .dock{display:flex}
 .legal{padding-bottom:110px}
 .hero-cta{flex-direction:column}
 .hero-cta .qr{display:none}
 .hero-cta .stores{flex-direction:row;justify-content:center}
}
@media (max-width:520px){
 .wrap{width:calc(100% - 32px)}
 .hero h1{font-size:clamp(58px,17vw,80px)}
 .hero-kicker{font-size:18px}.hero-kicker:after{width:30px}
 .eyebrow{font-size:19px}.eyebrow:before{width:26px}
 .stores{width:100%}
 .store{flex:1 1 0;min-width:0;justify-content:center;height:56px;padding:0 10px}
 .store span{font-size:17px}
 .stage{transform:scale(.6);margin-bottom:-240px}
 .node span{width:84px;font-size:11px}.node .bub{width:52px;height:52px}.node .bub .ico{width:24px;height:24px}
 .c360{padding:28px 22px}
 .fcard{padding:18px 8px 14px}
}
@media (max-width:380px){ .stage{transform:scale(.52);margin-bottom:-288px} .hero-cta .stores{flex-direction:column} }
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}.reveal{opacity:1;transform:none}html{scroll-behavior:auto}}

 $('[data-list=steps]').innerHTML=d.how.steps.map(function(s,i){return '<li class="step reveal" style="--d:'+i+'"><span class="n">0'+(i+1)+'</span><div><b>'+esc(s[0])+'</b><p>'+esc(s[1])+'</p></div></li>'}).join('');
 $('[data-list=c360]').innerHTML=d.c360.items.map(function(t){return '<li>'+ic('check')+esc(t)+'</li>'}).join('');
 $('[data-list=faq]').innerHTML=d.faq.items.map(function(q,i){return '<details class="reveal" style="--d:'+i+'"'+(i===0?' open':'')+'><summary>'+esc(q[0])+'<i>'+ic('plus')+'</i></summary><p>'+esc(q[1])+'</p></details>'}).join('');
 $$('[data-phone]').forEach(function(p){p.innerHTML=screen(p.getAttribute('data-phone'),d.ui)});
 $$('[data-shot]').forEach(function(p){var k=p.getAttribute('data-shot');p.innerHTML='<div class="scr scr--shot"><img src="assets/images/owner-app/'+k+'.webp" width="588" height="1280" alt="'+esc(d.shots[k]||'')+'" decoding="async"'+(p.closest('.hero')?' fetchpriority="high"':' loading="lazy"')+'></div>'});
 $('[data-list=marquee]').innerHTML=(function(){var ks=['sign-in','all-properties','property-home','finance','receipts','housekeeping','reservations','reports','occupancy-revenue','reviews'];var one=ks.map(function(k){return '<figure class="mq-item"><div class="phone"><div class="scr scr--shot"><img src="assets/images/owner-app/'+k+'.webp" width="588" height="1280" loading="lazy" decoding="async" alt="'+esc(d.shots[k])+'"></div></div><figcaption>'+esc(d.shots[k])+'</figcaption></figure>'}).join('');return one+one.replace(/alt="[^"]*"/g,'alt=""').replace(/<figure /g,'<figure aria-hidden="true" ')})();
 reveal();
}

/* reveal + live dashboard */
var io;
function reveal(){
 var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
 if(io)io.disconnect();
 if(reduce||!('IntersectionObserver' in window)){$$('.reveal').forEach(function(e){e.classList.add('in')});$$('.phone').forEach(function(p){p.classList.add('live-on')});return}
 document.documentElement.classList.add('js');
 io=new IntersectionObserver(function(es){es.forEach(function(e){if(!e.isIntersecting)return;var t=e.target;io.unobserve(t);
  if(t.classList.contains('phone')){t.classList.add('live-on');$$('[data-count]',t).forEach(function(el){var to=+el.getAttribute('data-count'),t0=performance.now();(function step(n){var p=Math.min(1,(n-t0)/1400);p=1-Math.pow(1-p,3);el.textContent=Math.round(to*p).toLocaleString('en-US');if(p<1)requestAnimationFrame(step)})(t0)})}
  else t.classList.add('in')})},{threshold:.18,rootMargin:'0px 0px -6% 0px'});
 $$('.reveal,.phone').forEach(function(e){io.observe(e)});
}

/* language: ?lang= → server hint → saved → browser */
try{var q=params.get('lang'),saved=localStorage.getItem('fandaqah_app_lang');lang=['en','ar'].indexOf(q)>-1?q:['en','ar'].indexOf(BOOT.lang)>-1?BOOT.lang:['en','ar'].indexOf(saved)>-1?saved:(/^ar/i.test(navigator.language||'')?'ar':'en')}catch(e){}
$$('[data-lang]').forEach(function(b){b.addEventListener('click',function(){lang=b.getAttribute('data-lang');try{localStorage.setItem('fandaqah_app_lang',lang)}catch(e){}try{var u=new URL(location.href);u.searchParams.set('lang',lang);history.replaceState(null,'',u)}catch(e){}render();track('owner_app_language',{to:lang})})});
document.addEventListener('click',function(e){var a=e.target.closest('[data-ev]');if(!a)return;var st=a.getAttribute('data-store');track(st?'owner_app_store_click':'owner_app_click',{placement:a.getAttribute('data-ev'),store:st||undefined})});
var y=$('[data-year]');if(y)y.textContent=new Date().getFullYear();
render();
/* mobile dock appears after the hero buttons scroll away */
var heroStores=$('[data-stores=hero]'),dk=$('.dock');
if('IntersectionObserver' in window&&heroStores)new IntersectionObserver(function(es){var show=!es[0].isIntersecting&&es[0].boundingClientRect.top<0;dk.classList.toggle('show',show);dk.setAttribute('aria-hidden',String(!show))}).observe(heroStores);
})();
</script>
